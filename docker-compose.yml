services:
  frontend:
    build:
      context: ./vete-app
      dockerfile: Dockerfile
    image: vete-app:latest
    ports:
      - "4200:4200"
    depends_on:
      - backend
      
  backend:
    build:
      context: ./vete-api
      dockerfile: Dockerfile
    image: vete-api:latest
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://vete-admin:securepassword1234!@postgres:5432/vetedb'
      DB_SYNC: 'true'
      DB_SSL: 'false'
    depends_on:
      - postgres

  postgres:
    image: 'postgres:latest'
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=vete-admin
      - POSTGRES_DB=vetedb
      - POSTGRES_PASSWORD=securepassword1234!
    ports:
      - '5432:5432'
  adminer:
        image: adminer
        ports:
          - 8080:8080
        depends_on:
          - postgres
volumes:
  postgres-data:
    driver: local