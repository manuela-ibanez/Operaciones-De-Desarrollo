apiVersion: v1
kind: Service
metadata:
  name: vete-api
spec:
  type: NodePort
  selector:
    app: vete-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: vete-app
spec:
  type: NodePort
  selector:
    app: vete-app
  ports:
    - name: http
      port: 4200
      targetPort: 80
      nodePort: 30081
