apiVersion: apps/v1
kind: Deployment
metadata:
  name: vete-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vete-app
  template:
    metadata:
      labels:
        app: vete-app
    spec:
      containers:
        - name: vete-app
          image: vete-app:nginx
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi